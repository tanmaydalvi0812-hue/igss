services:
  - type: web
    name: telegram-playwright-ig-bot
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 bot:app
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TARGET_URL
        value: https://www.instagram.com/
